name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Track the latest stable Go (org convention). go.mod floor is 1.26.4.
jobs:
  workflows:
    name: workflows parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A workflow that fails to PARSE reports nothing at all: no jobs run, no
      # checks appear, and a pull request looks unexercised rather than broken.
      # Every other lane is downstream of the file itself being readable, so none
      # of them can report that it is not. This is the only lane that would.
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  # Build + vet + test the whole module CGO-free on Linux. The native window and
  # tray back-ends (gw.Open / win.Run, NSStatusItem, DBus) are a launch-verified
  # boundary that in-process tests do not reach — they are excluded from the
  # coverage gate the way the reader's own window loop was — so the testable
  # logic (event translation, present gating, the appearance pump, the
  # launch-height seam, the ready-after-first-frame counter, the tray-branch of
  # Run) is covered to 100% while the native path is proven by the cross-build
  # lane and by launching the app.
  test:
    name: test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go version
      - run: CGO_ENABLED=0 go vet ./...
      - run: CGO_ENABLED=0 go build ./...
      - name: Gofmt
        # go vet does NOT check formatting, so drift accumulates silently.
        # Printing the diff makes a failure actionable rather than just a list of
        # names.
        run: |
          drift=$(gofmt -l .)
          if [ -n "$drift" ]; then
            echo "::error::not gofmt-clean:"; echo "$drift"
            gofmt -d .
            exit 1
          fi
      - name: Test + enforce coverage (native run loop excluded)
        # The native gw.Open/win.Run loop (the `run` function) is a
        # launch-verified boundary in-process tests do not reach — excluded the
        # way the reader excludes its whole window package. EVERYTHING ELSE must
        # be 100%, enforced here so drift cannot creep in behind the exclusion.
        run: |
          CGO_ENABLED=0 go test -covermode=set -coverprofile=cover.out ./...
          under=$(go tool cover -func=cover.out \
            | grep -vE '/run\.go:[0-9]+:[[:space:]]+run[[:space:]]' \
            | grep -v '^total:' \
            | grep -v '100.0%' || true)
          if [ -n "$under" ]; then
            echo "::error::below 100% outside the native run boundary:"
            echo "$under"
            exit 1
          fi
          go tool cover -func=cover.out | awk '/^total:/{print "coverage (native run loop included):",$3}'

  # Prove the module compiles CGO-free for every target the window and tray
  # back-ends support, so a change that builds on Linux cannot silently break the
  # macOS or Windows native path (the one in-process tests cannot exercise).
  cross:
    name: cross-build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - env:
          GOOS: ${{ matrix.goos }}
          CGO_ENABLED: "0"
        run: go build ./...
